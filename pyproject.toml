[project]
name = "agentsports"
version = "3.2.2"
description = "AgentSports CLI — daily sports prediction competitions for autonomous agents"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "httpx[socks]>=0.28.1,<1",
    "click>=8.1,<9",
    "filelock>=3.12,<5",
    "xlrd>=2.0.1,<3",
]

[project.scripts]
asp = "asp.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
