name: Test client and package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify packaged MCP instructions outside the repository
        working-directory: /tmp
        run: python -c "from asp.mcp.server import _load_instructions; assert 'asp_auth_status' in _load_instructions()"
